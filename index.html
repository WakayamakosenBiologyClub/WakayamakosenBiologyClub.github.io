<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生物記録</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
:root{
  --gd:#1B4332;--gm:#52B788;--gl:#95D5B2;
  --cream:#FEFAE0;--soil:#D4A373;
  --text:#1a1a1a;--tl:#666;--white:#fff;
  --nav:64px;--hdr:52px;--r:12px;
  --sh:0 2px 12px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--cream);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
#hdr{height:var(--hdr);min-height:var(--hdr);background:var(--gd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;letter-spacing:.05em;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-shrink:0;z-index:100;}
#hdr-t{display:flex;align-items:center;gap:8px;}
#hdr-t svg{width:22px;height:22px;fill:var(--gl);}

/* PAGES */
#pages{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;}
.page.active{display:block;}
#map-page{overflow:hidden;}

/* NAV */
#nav{height:var(--nav);min-height:var(--nav);background:var(--gd);display:flex;align-items:stretch;box-shadow:0 -2px 12px rgba(0,0,0,.25);flex-shrink:0;z-index:100;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.45);font-size:.58rem;font-family:inherit;transition:color .2s;padding:0;position:relative;}
.nb svg{width:24px;height:24px;transition:transform .2s;}
.nb.active{color:var(--gl);}
.nb.active svg{transform:scale(1.15);}
.nb.active::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:3px;background:var(--gl);border-radius:0 0 4px 4px;}

/* MAP */
#map-page{padding:0;display:none;}
#map-page.active{display:flex;flex-direction:row;}
#map{flex:1;height:100%;}

/* MAP サイドミニリスト（デスクトップのみ） */
#map-minilist{display:none;width:260px;min-width:260px;background:#fff;border-left:1px solid #ddd;overflow-y:auto;flex-shrink:0;}
@media(min-width:900px){
  #map-minilist{display:flex;flex-direction:column;}
}
#map-minilist-hdr{padding:10px 12px 8px;background:var(--gd);color:#fff;font-size:.78rem;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:6px;flex-shrink:0;}
#map-minilist-hdr svg{width:14px;height:14px;fill:var(--gl);}
#map-minilist-body{flex:1;overflow-y:auto;}
.ml-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s;}
.ml-item:hover{background:#f5faf7;}
.ml-img{width:44px;height:44px;border-radius:6px;flex-shrink:0;background:#e8f5ee;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ml-img img{width:100%;height:100%;object-fit:cover;}
.ml-img svg{width:20px;height:20px;fill:#c8e6c9;}
.ml-name{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ml-date{font-size:.68rem;color:var(--tl);margin-top:1px;}
.ml-badge{font-size:.58rem;padding:1px 5px;border-radius:8px;font-weight:700;flex-shrink:0;margin-left:auto;}

/* マップ上フローティングUI */
#map-fab{position:absolute;bottom:16px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.fab-btn{width:44px;height:44px;border-radius:22px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:opacity .2s;}
.fab-btn svg{width:20px;height:20px;pointer-events:none;}
.fab-main{background:var(--gd);color:#fff;}
.fab-main svg{fill:#fff;}
.fab-sub{background:#fff;color:var(--gd);font-size:.65rem;font-family:inherit;font-weight:700;width:auto;padding:0 12px;border-radius:20px;gap:6px;}
.fab-sub svg{fill:var(--gd);width:16px;height:16px;}
.fab-sub.on{background:var(--gm);color:#fff;}
.fab-sub.on svg{fill:#fff;}
#map-filter-panel{position:absolute;bottom:72px;right:12px;z-index:1000;background:rgba(27,67,50,.95);border-radius:var(--r);padding:12px;display:none;flex-direction:column;gap:8px;min-width:200px;box-shadow:var(--sh);}
#map-filter-panel.open{display:flex;}
.fp-label{color:rgba(255,255,255,.6);font-size:.68rem;letter-spacing:.05em;}
.fp-row{display:flex;gap:6px;flex-wrap:wrap;}
.fp-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px;font-size:.72rem;font-family:inherit;cursor:pointer;white-space:nowrap;}
.fp-btn.active{background:var(--gm);border-color:var(--gm);}
.kdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;}
.dp{background:#52b788;}.da{background:#e76f51;}.df{background:#9b72cf;}

/* Leaflet layer control positioning */
.leaflet-top.leaflet-right{top:10px;}

/* FORM */
#form-page{background:var(--cream);padding:16px 16px 24px;}
.ks{display:flex;gap:8px;margin-bottom:16px;}
.kb{flex:1;padding:10px 4px;border:2px solid transparent;border-radius:10px;font-size:.8rem;font-family:inherit;font-weight:500;cursor:pointer;background:#fff;color:var(--tl);}
.kb[data-k="植物界"].active{background:#e8f5ee;border-color:#52B788;color:#1B4332;}
.kb[data-k="動物界"].active{background:#fdf0ec;border-color:#e76f51;color:#8b3a1e;}
.kb[data-k="菌界"].active{background:#f3eefa;border-color:#9b72cf;color:#4a2d7a;}
.fs{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.fs h3{font-size:.78rem;color:var(--tl);margin-bottom:12px;letter-spacing:.06em;text-transform:uppercase;}
.fi{margin-bottom:12px;}
.fi:last-child{margin-bottom:0;}
.fi label{display:block;font-size:.78rem;color:var(--tl);margin-bottom:5px;font-weight:500;}
.fi input,.fi textarea,.fi select{width:100%;padding:11px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:.9rem;font-family:inherit;background:var(--cream);color:var(--text);appearance:none;transition:border-color .2s;}
.fi input:focus,.fi textarea:focus,.fi select:focus{outline:none;border-color:var(--gm);}
.fi textarea{height:80px;resize:none;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ipb{width:100%;padding:12px;border-radius:8px;border:2px dashed #c8e6c9;background:#f1f8f4;color:var(--gd);font-size:.85rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.ipb svg{width:18px;height:18px;}
/* multi-image preview strip */
#imgs-preview{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px;}
.prev-thumb{position:relative;flex-shrink:0;}
.prev-thumb img{width:80px;height:80px;object-fit:cover;border-radius:8px;display:block;}
.prev-thumb .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:10px;background:#e53935;color:#fff;border:none;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rbtn{width:100%;padding:16px;background:var(--gd);color:#fff;border:none;border-radius:var(--r);font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;box-shadow:0 4px 16px rgba(27,67,50,.35);display:flex;align-items:center;justify-content:center;gap:8px;}
.rbtn:active{opacity:.85;}
.rbtn svg{width:20px;height:20px;}

/* 座標・市町村読み込みボタン行 */
.coord-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.coord-btn{flex:1;min-width:0;padding:8px 6px;background:#e8f5ee;border:1.5px solid #c8e6c9;border-radius:8px;font-size:.72rem;font-family:inherit;font-weight:600;color:var(--gd);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;}
.coord-btn svg{width:13px;height:13px;flex-shrink:0;}
.coord-msg{font-size:.72rem;color:var(--tl);margin-top:4px;min-height:16px;}
.coord-msg.err{color:#e53935;}

/* LIST */
#list-page{background:#f0f4f1;padding-bottom:8px;}
.lh{background:#fff;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:10;}
.sb{display:flex;align-items:center;gap:8px;background:var(--cream);border:1.5px solid #ddd;border-radius:20px;padding:8px 14px;margin-bottom:10px;}
.sb svg{width:16px;height:16px;fill:#aaa;flex-shrink:0;}
.sb input{border:none;background:none;flex:1;font-size:.88rem;font-family:inherit;color:var(--text);}
.sb input:focus{outline:none;}
.ft{display:flex;gap:6px;}
.ftb{flex:1;padding:6px 0;border:none;border-radius:16px;font-size:.72rem;font-family:inherit;font-weight:500;cursor:pointer;background:#f0f0f0;color:var(--tl);}
.ftb.active{background:var(--gd);color:#fff;}
#list-items{padding:8px 12px;}
.lc{background:#fff;border-radius:10px;display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 5px rgba(0,0,0,.07);cursor:pointer;}
.lc:active{opacity:.85;}
.lci{width:64px;height:64px;border-radius:8px;flex-shrink:0;background:#e8f5ee;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.lci img{width:100%;height:100%;object-fit:cover;}
.lci svg{width:28px;height:28px;fill:#c8e6c9;}
.lc-info{flex:1;min-width:0;}
.lc-name{font-size:.95rem;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc-date{font-size:.75rem;color:var(--tl);}
/* デスクトップ用リスト追加情報 */
.lc-extra{display:none;font-size:.72rem;color:var(--tl);margin-top:3px;}
@media(min-width:900px){
  .lc-extra{display:block;}
  .lci{width:80px;height:80px;}
  .lc-name{font-size:1rem;}
  #list-items{padding:10px 20px;}
  .lc{padding:14px;}
}
.badge{font-size:.62rem;padding:2px 7px;border-radius:10px;font-weight:700;flex-shrink:0;}
.bp{background:#e8f5ee;color:#1B4332;}.ba{background:#fdf0ec;color:#8b3a1e;}.bf{background:#f3eefa;color:#4a2d7a;}
.empty{text-align:center;padding:60px 20px;color:var(--tl);}
.empty svg{width:56px;height:56px;fill:#c8e6c9;margin-bottom:16px;}

/* GRID */
#grid-page{background:#f0f4f1;padding-bottom:8px;}
#grid-items{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px;}
@media(min-width:700px){#grid-items{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1000px){#grid-items{grid-template-columns:repeat(4,1fr);padding:12px 20px;}}
.gc{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.07);cursor:pointer;}
.gc:active{opacity:.85;}
.gc-img{width:100%;aspect-ratio:1;object-fit:cover;background:#e8f5ee;display:flex;align-items:center;justify-content:center;}
.gc-img img{width:100%;height:100%;object-fit:cover;}
.gc-img svg{width:40px;height:40px;fill:#c8e6c9;}
.gc-info{padding:8px 10px;}
.gc-name{font-size:.88rem;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gc-date{font-size:.7rem;color:var(--tl);}

/* DETAIL */
#detail-page{background:var(--cream);}
.dbk{position:sticky;top:0;z-index:1000;background:var(--gd);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:700;cursor:pointer;border:none;width:100%;font-family:inherit;}
.dbk svg{width:20px;height:20px;fill:currentColor;}
/* Photo swiper */
#detail-swiper{position:relative;width:100%;overflow:hidden;background:#000;touch-action:pan-y;}
#swiper-track{display:flex;transition:transform .3s ease;}
.swiper-slide{flex-shrink:0;width:100%;}
.swiper-slide img{width:100%;max-height:280px;object-fit:cover;display:block;}
#swiper-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;}
.sdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);}
.sdot.active{background:#fff;}
#swiper-prev,#swiper-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
#swiper-prev{left:6px;}#swiper-next{right:6px;}
.dbody{padding:16px;}
.dsp{font-size:1.4rem;font-weight:700;margin-bottom:4px;line-height:1.3;}
.dc{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:14px;}
.cn{display:none;}.cnt{background:#fff9c4;color:#827717;}.cnv{background:#ffe0b2;color:#bf360c;}
.cne{background:#ffccbc;color:#b71c1c;}.cnc{background:#f8bbd0;color:#880e4f;}.cnd{background:#e0e0e0;color:#424242;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.di{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.di-l{font-size:.68rem;color:var(--tl);margin-bottom:2px;}
.di-v{font-size:.85rem;font-weight:600;}
.di.full{grid-column:1/-1;}
.dnotes{background:#fff;border-radius:8px;padding:14px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.dnotes-l{font-size:.7rem;color:var(--tl);margin-bottom:6px;}
.dnotes-t{font-size:.88rem;line-height:1.65;white-space:pre-wrap;}
#dmap-box{width:100%;height:220px;border-radius:8px;overflow:hidden;margin-bottom:24px;position:relative;z-index:0;}
.wiki-s{background:#fff;border-radius:8px;padding:14px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.wiki-s h4{font-size:.78rem;color:var(--tl);margin-bottom:10px;}
.wiki-c{font-size:.85rem;line-height:1.7;}
.wiki-c h2{font-size:.95rem;margin:12px 0 6px;border-bottom:1px solid #eee;padding-bottom:4px;}

/* EDIT */
#edit-page{background:var(--cream);padding:0;}
.eh{background:var(--gd);color:#fff;padding:14px 16px;font-size:1rem;font-weight:700;}
.eb{padding:16px 16px 24px;}
.esw{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.esw label{font-size:.78rem;color:var(--tl);display:block;margin-bottom:6px;}
.esw select{width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:.88rem;font-family:inherit;background:var(--cream);color:var(--text);appearance:none;}
.ea{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
.eab{padding:13px;border:none;border-radius:10px;font-size:.88rem;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.eab:active{opacity:.8;}
.eu{background:var(--gd);color:#fff;}.es2{background:var(--soil);color:#fff;}
.ed{background:#e53935;color:#fff;grid-column:1/-1;}
.eab svg{width:16px;height:16px;fill:currentColor;}
#e-imgs-preview{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px;}

/* DATA PAGE */
#data-page{background:var(--cream);padding:16px;}
.dc2{background:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.dc2 h3{font-size:.85rem;font-weight:700;margin-bottom:6px;color:var(--gd);}
.dc2 p{font-size:.78rem;color:var(--tl);line-height:1.6;margin-bottom:12px;}
.dfb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:none;border-radius:10px;font-size:.9rem;font-weight:700;font-family:inherit;cursor:pointer;}
.dfb svg{width:18px;height:18px;fill:currentColor;}
.bl{background:var(--gd);color:#fff;}.bm{background:var(--gm);color:#fff;}
.dstat{background:var(--gd);border-radius:var(--r);padding:16px;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:14px;}
.dsn{font-size:1.8rem;font-weight:700;}.dsl{font-size:.75rem;opacity:.7;}

/* MODAL */
#img-modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);align-items:center;justify-content:center;}
#img-modal.open{display:flex;}
#img-modal img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:8px;}

/* DATE PICKER DRUM */
#date-picker-overlay{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.5);}
#date-picker-overlay.open{display:block;}
#date-picker-sheet{position:fixed;bottom:0;left:0;right:0;z-index:9001;background:#fff;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0);display:none;}
#date-picker-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid #eee;}
#date-picker-hdr span{font-size:.95rem;font-weight:700;color:var(--gd);}
#date-picker-hdr button{background:none;border:none;font-size:.88rem;font-family:inherit;cursor:pointer;padding:4px 8px;border-radius:8px;}
#date-picker-hdr .dp-cancel{color:var(--tl);}
#date-picker-hdr .dp-ok{background:var(--gd);color:#fff;font-weight:700;}
#date-picker-drums{display:flex;justify-content:center;height:216px;position:relative;}
#date-picker-drums::before,#date-picker-drums::after{content:'';position:absolute;left:0;right:0;height:80px;z-index:2;pointer-events:none;}
#date-picker-drums::before{top:0;background:linear-gradient(to bottom,rgba(255,255,255,1),rgba(255,255,255,0));}
#date-picker-drums::after{bottom:0;background:linear-gradient(to top,rgba(255,255,255,1),rgba(255,255,255,0));}
.dp-col{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;}
.dp-col::-webkit-scrollbar{display:none;}
.dp-col-inner{padding:80px 0;}
.dp-item{height:44px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;color:#bbb;scroll-snap-align:center;user-select:none;}
.dp-center-line{position:absolute;top:50%;left:8px;right:8px;transform:translateY(-50%);height:44px;border-top:2px solid var(--gl);border-bottom:2px solid var(--gl);border-radius:4px;pointer-events:none;z-index:3;}

/* 元画質チェックボックス */
.orig-quality-row{display:flex;align-items:center;gap:0;background:#fff;border:1.5px solid #c8e6c9;border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;width:100%;}
.orig-quality-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--gd);flex-shrink:0;cursor:pointer;margin:0;}
.orig-quality-label{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--gd);font-weight:500;margin-left:10px;line-height:1.3;}
.orig-quality-row:has(input:checked){background:#e8f5ee;border-color:var(--gm);}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav) + 14px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--gd);color:#fff;padding:10px 20px;border-radius:20px;font-size:.82rem;box-shadow:var(--sh);z-index:5000;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Leaflet overrides */
.leaflet-control-zoom{border-radius:8px!important;overflow:hidden;}
.leaflet-touch .leaflet-control-zoom-in,.leaflet-touch .leaflet-control-zoom-out{font-size:20px!important;line-height:34px!important;width:34px!important;height:34px!important;}
</style>
</head>
<body>

<div id="hdr">
  <div id="hdr-t">
    <svg viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-8 2-4.5 1-6 3.5-8 6"/></svg>
    生物記録システム
  </div>
</div>

<div id="pages">

<!-- MAP -->
<div id="map-page" class="page">
  <div id="map"></div>
  <!-- デスクトップ用サイドミニリスト -->
  <div id="map-minilist">
    <div id="map-minilist-hdr">

};

// ━━ MAP INIT ━━
function initMap(){

  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});

  map=L.map('map',{center:[34.226034,135.167507],zoom:8,layers:[osm]});
  L.control.layers({'標準':osm,'衛星写真':sat},{'植生（環境省）':veg}).addTo(map);

// ━━ MARKERS ━━
function buildPopup(p,idx){
  const consMap={'指定なし':'cn','準絶滅危惧(NT)':'cnt','絶滅危惧II(VU)':'cnv','絶滅危惧IB(EN)':'cne','絶滅危惧IA(CR)':'cnc','情報不足(DD)':'cnd'};
  let h=`<strong>${p.species}</strong>`;
  if(p.conservation&&p.conservation!=='指定なし'){
    const cls=consMap[p.conservation]||'cn';
    h+=`<br><span class="dc ${cls}">${p.conservation}</span>`;
  }
  if(p.location)h+=`<br><small>場所：${p.location}</small>`;
  h+=`<br><small>日付：${p.discoveredDate||''}</small>`;
  const imgs=p.images||[];
  if(imgs.length)h+=`<br><img src="${imgs[0]}" style="width:140px;height:100px;object-fit:cover;border-radius:6px;margin:4px 0;cursor:pointer" onclick="openModal('${imgs[0]}')">`;
  h+=`<br><button onclick="openDetail(${idx})" style="margin-top:6px;padding:6px 14px;background:#1B4332;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">詳細</button>`;
  return h;
}
function addMarker(p,idx){
  const m=L.marker([p.lat,p.lng],{icon:icon(p.kingdom)});
  m.bindPopup(buildPopup(p,idx),{maxWidth:220});
  markers[idx]=m;
}
function updateMapMarkers(){
  for(let i=0;i<pins.length;i++){
    const m=markers[i];if(!m)continue;
    if(hmOn){map.hasLayer(m)&&m.remove();continue;}
    const ok=(!mapKF||pins[i].kingdom===mapKF);
    ok?(!map.hasLayer(m)&&m.addTo(map)):(map.hasLayer(m)&&m.remove());
  }
}

// ━━ MINI LIST (MAP SIDEBAR) ━━
function renderMiniList(){
  const body=document.getElementById('map-minilist-body');

  body.innerHTML='';

  if(!filtered.length){
    body.innerHTML='<div style="padding:20px;text-align:center;color:#aaa;font-size:.78rem;">記録がありません</div>';

    const imgs=p.images||[];
    const imgH=imgs.length
      ?`<div class="ml-img"><img src="${imgs[0]}" loading="lazy"></div>`
      :`<div class="ml-img"><svg viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 21L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2-8 2-4.5 1-6 3.5-8 6"/></svg></div>`;
    const bClass=p.kingdom==='動物界'?'ba':p.kingdom==='菌界'?'bf':'bp';
    const bLabel=p.kingdom.replace('界','');
    const div=document.createElement('div');
    div.className='ml-item';
    div.innerHTML=`${imgH}<div style="flex:1;min-width:0;"><div class="ml-name">${p.species}</div><div class="ml-date">${p.discoveredDate||''}${p.location?' · '+p.location:''}</div></div><span class="badge ml-badge ${bClass}">${bLabel}</span>`;
    div.onclick=()=>{
      map.setView([p.lat,p.lng],14);
      setTimeout(()=>markers[i]&&markers[i].openPopup(),300);
    };
    body.appendChild(div);

}

// ━━ HEATMAP ━━
function updateHeatmap(){
  if(hmLayer){map.removeLayer(hmLayer);hmLayer=null;}
  if(!hmOn)return;
  hmLayer=L.layerGroup();
  const z=map.getZoom(),b=map.getBounds();
  const tl=map.project(b.getNorthWest(),z),br=map.project(b.getSouthEast(),z);
  const cs=11,cols=Math.ceil((br.x-tl.x)/cs),rows=Math.ceil((br.y-tl.y)/cs);
  const g=Array.from({length:rows},()=>new Array(cols).fill(0));
  let max=0;
  pins.forEach(p=>{
    if(mapKF&&p.kingdom!==mapKF)return;
    const pt=map.project(L.latLng(p.lat,p.lng),z);
    const c=Math.floor((pt.x-tl.x)/cs),r=Math.floor((pt.y-tl.y)/cs);
    if(c>=0&&c<cols&&r>=0&&r<rows){g[r][c]++;if(g[r][c]>max)max=g[r][c];}
  });
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(!g[r][c])continue;
    const x1=tl.x+c*cs,y1=tl.y+r*cs;
    const nw=map.unproject(L.point(x1,y1),z),se=map.unproject(L.point(x1+cs,y1+cs),z);
    const ratio=g[r][c]/max;
    L.rectangle([nw,se],{color:'#fff',weight:1,fillColor:`rgb(255,${Math.round(165*(1-ratio))},0)`,fillOpacity:.6,interactive:false}).addTo(hmLayer);
  }
  hmLayer.addTo(map);
}

// ━━ IMAGE UTILS ━━
function compress(dataUrl,q=0.6){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=800;let w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',q));
    };
    img.src=dataUrl;
  });
}
function readFile(file, keepOriginal=false){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=async e=>{
      if(keepOriginal){
        res(e.target.result);
      }else{
        res(await compress(e.target.result));
      }
    };
    r.readAsDataURL(file);
  });
}

// ━━ EXIF 座標読み込み ━━
// ExifデータをバイナリArrayBufferから解析
function parseExifCoords(buffer){
  const view=new DataView(buffer);
  // JPEG SOI
  if(view.getUint16(0)!==0xFFD8)return null;
  let offset=2;
  while(offset<view.byteLength){
    const marker=view.getUint16(offset);
    offset+=2;
    if(marker===0xFFE1){
      const len=view.getUint16(offset);
      const exifHeader=String.fromCharCode(
        view.getUint8(offset+2),view.getUint8(offset+3),
        view.getUint8(offset+4),view.getUint8(offset+5)
      );
      if(exifHeader==='Exif'){
        return parseIFD(buffer,offset+8);
      }
      offset+=len;
    }else if((marker&0xFF00)===0xFF00){
      offset+=view.getUint16(offset);
    }else break;
  }
  return null;
}

function parseIFD(buffer,start){
  const view=new DataView(buffer);
  const isLE=view.getUint16(start)===0x4949;
  const r16=(o)=>isLE?view.getUint16(o,true):view.getUint16(o);
  const r32=(o)=>isLE?view.getUint32(o,true):view.getUint32(o);

  const ifdOffset=r32(start+4)+start;
  const count=r16(ifdOffset);

  let latRef='',lat=null,lngRef='',lng=null,gpsOffset=0;
  for(let i=0;i<count;i++){
    const e=ifdOffset+2+i*12;
    const tag=r16(e);
    if(tag===0x8825) gpsOffset=r32(e+8)+start;
  }
  if(!gpsOffset)return null;

  const gpsCount=r16(gpsOffset);
  for(let i=0;i<gpsCount;i++){
    const e=gpsOffset+2+i*12;
    const tag=r16(e);
    const type=r16(e+2);
    const cnt=r32(e+4);
    const valOff=r32(e+8)+start;
    if(tag===1){latRef=String.fromCharCode(view.getUint8(e+8));}
    else if(tag===2&&type===5&&cnt===3){lat=readRational3(view,valOff,isLE);}
    else if(tag===3){lngRef=String.fromCharCode(view.getUint8(e+8));}
    else if(tag===4&&type===5&&cnt===3){lng=readRational3(view,valOff,isLE);}
  }
  if(lat===null||lng===null)return null;
  let latDec=lat[0]+lat[1]/60+lat[2]/3600;
  let lngDec=lng[0]+lng[1]/60+lng[2]/3600;
  if(latRef==='S')latDec=-latDec;
  if(lngRef==='W')lngDec=-lngDec;
  return {lat:latDec,lng:lngDec};
}

function readRational3(view,offset,isLE){
  const r=(o)=>isLE?view.getUint32(o,true):view.getUint32(o);
  return [r(offset)/r(offset+4), r(offset+8)/r(offset+12), r(offset+16)/r(offset+20)];
}

// 座標読み込みボタン処理
// coordInputId: 座標inputのid, msgId: メッセージdivのid
// 複数写真がある場合は必ず1枚目（files[0]）から座標を取得する
function readExifCoords(coordInputId, msgId){
  const msg=document.getElementById(msgId);
  const files=coordInputId.startsWith('f-')?lastFormFiles:lastEditFiles;
  if(!files||files.length===0){
    msg.textContent='まず写真を選択してください';
    msg.className='coord-msg err';
    return;
  }
  msg.textContent='読み込み中...';
  msg.className='coord-msg';

  // 複数枚あっても常に1枚目から座標を取得
  const file=files[0];
  const fr=new FileReader();
  fr.onload=e=>{
    try{
      const coords=parseExifCoords(e.target.result);
      if(coords){
        const latStr=coords.lat.toFixed(5);
        const lngStr=coords.lng.toFixed(5);
        document.getElementById(coordInputId).value=`${latStr}, ${lngStr}`;
        msg.textContent=`座標を読み込みました (1枚目): ${latStr}, ${lngStr}`;
        msg.className='coord-msg';
      }else{
        msg.textContent='1枚目の写真に座標情報が見つかりませんでした';
        msg.className='coord-msg err';
      }
    }catch(err){
      msg.textContent='座標の読み込みに失敗しました';
      msg.className='coord-msg err';
    }
  };
  fr.readAsArrayBuffer(file);
}

// 座標から都道府県・市町村取得（国土地理院API）
async function loadMunicipality(coordInputId, locationInputId, msgId){
  const msg=document.getElementById(msgId);
  const val=document.getElementById(coordInputId).value.trim();
  if(!val){msg.textContent='先に座標を入力してください';msg.className='coord-msg err';return;}
  const parts=val.split(',').map(v=>parseFloat(v.trim()));
  if(parts.length<2||isNaN(parts[0])||isNaN(parts[1])){
    msg.textContent='座標の形式が正しくありません';msg.className='coord-msg err';return;
  }
  const [lat,lng]=parts;
  msg.textContent='住所を取得中...';msg.className='coord-msg';
  try{
    // HeartRails Express API: 都道府県・郡・市区町村・町域まで返す
    const res=await fetch(`https://geoapi.heartrails.com/api/json?method=searchByGeoLocation&x=${lng}&y=${lat}`);
    const data=await res.json();
    const loc=data.response&&data.response.location&&data.response.location[0];
    if(loc){
      // prefecture / city（郡+市区町村）/ town（町域）を結合
      // 例: 和歌山県 → 伊都郡九度山町 → 九度山
      const pref=loc.prefecture||'';
      const city=loc.city||'';      // 郡がある場合は「○○郡○○町」が入る
      const town=loc.town||'';      // 町域（大字レベル）
      const fullName=pref+city+town;
      document.getElementById(locationInputId).value=fullName;
      msg.textContent=`取得しました: ${fullName}`;
      msg.className='coord-msg';
    }else{
      // フォールバック: 国土地理院API
      const res2=await fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lon=${lng}&lat=${lat}`);
      const data2=await res2.json();
      if(data2.results&&data2.results.muniCd){
        const r=data2.results;
        const prefCode=String(r.muniCd).padStart(5,'0').slice(0,2);
        const prefName=PREF_NAMES[prefCode]||'';
        const muniName=r.lv01Nm||'';
        const fullName=prefName+muniName;
        document.getElementById(locationInputId).value=fullName;
        msg.textContent=`取得しました: ${fullName}`;
        msg.className='coord-msg';
      }else{
        msg.textContent='住所情報が見つかりませんでした';msg.className='coord-msg err';
      }
    }
  }catch(e){
    msg.textContent='取得に失敗しました';msg.className='coord-msg err';
  }
}

function saveTxt(p){

  const imgs=p.images||[];

// ━━ FILE LOAD ━━
function loadFiles(input){
  Array.from(input.files).forEach(file=>{
    const r=new FileReader();
    r.onload=e=>{
      const lines=e.target.result.split('\n');
      const g=k=>lines.find(l=>l.startsWith(k+': '))?.slice(k.length+2).trim()||'';
      const coords=(g('座標')||'').split(',');
      const lat=parseFloat(coords[0]),lng=parseFloat(coords[1]);
      const species=g('種名');
      if(!species||isNaN(lat)||isNaN(lng)){toast(`${file.name}: 形式エラー`);return;}
      const imgs=[];
      lines.forEach(l=>{
        const m=l.match(/^画像\d+: (.+)/);
        if(m&&m[1]!=='なし')imgs.push(m[1]);
      });
      if(!imgs.length){const old=g('画像');if(old&&old!=='なし')imgs.push(old);}
      const pin={
        species,kingdom:g('界'),family:g('科'),genus:g('属'),
        lat,lng,discoveredDate:g('発見日'),timestamp:g('記録時間'),
        location:g('都道府県市町村'),conservation:g('絶滅危惧種'),
        details:(g('詳細')||'').replace(/\\n/g,'\n'),
        images:imgs
      };
      pins.push(pin);
      addMarker(pin,pins.length-1);
      updateMapMarkers();
      document.getElementById('d-cnt').textContent=pins.length;
    };
    r.readAsText(file);
  });
  input.value='';
  setTimeout(()=>showPage('map'),1200);
}

function loadBoundary(input){
  Array.from(input.files).forEach(file=>{
    const r=new FileReader();
    r.onload=e=>{
      try{
        const topo=JSON.parse(e.target.result);
        const key=Object.keys(topo.objects)[0];
        const geo=topojson.feature(topo,topo.objects[key]);
        const layer=L.geoJSON(geo,{style:{color:'#0F5474',weight:2,fillColor:'#0F5474',fillOpacity:.2}}).addTo(map);
        boundaryLayers.push(layer);
        map.fitBounds(L.featureGroup(boundaryLayers).getBounds());
      }catch{toast('境界ファイルエラー');}
    };
    r.readAsText(file);
  });
  input.value='';
}

let swiperIdx=0,swiperImgs=[];

function openDetail(idx){
  curDetail=idx;
  const p=pins[idx];
  document.getElementById('d-sp').textContent=p.species;
  const consMap={'指定なし':'cn','準絶滅危惧(NT)':'cnt','絶滅危惧II(VU)':'cnv','絶滅危惧IB(EN)':'cne','絶滅危惧IA(CR)':'cnc','情報不足(DD)':'cnd'};
  const cd=document.getElementById('d-cn');
  cd.className='dc '+(consMap[p.conservation]||'cn');
  cd.textContent=p.conservation||'';
  document.getElementById('d-fa').textContent=p.family||'—';
  document.getElementById('d-ge').textContent=p.genus||'—';
  document.getElementById('d-dt').textContent=p.discoveredDate||'—';
  document.getElementById('d-lo').textContent=p.location||'—';
  document.getElementById('d-co').textContent=`${p.lat}, ${p.lng}`;
  document.getElementById('d-el').textContent='取得中...';
  // 国土地理院 標高API
  fetch(`https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${p.lng}&lat=${p.lat}&outtype=JSON`)
    .then(r=>r.json())
    .then(d=>{
      const el=d.elevation;
      if(el===null||el===undefined||isNaN(el)){
        document.getElementById('d-el').textContent='—';
      }else{
        document.getElementById('d-el').textContent=Math.round(el)+' m';
      }
    })
    .catch(()=>{document.getElementById('d-el').textContent='—';});
  document.getElementById('d-no').textContent=p.details||'';
  document.getElementById('d-nw').style.display=p.details?'block':'none';

  swiperImgs=p.images||[];
  const sw=document.getElementById('detail-swiper');
  if(swiperImgs.length){
    sw.style.display='block';
    buildSwiper(0);
    let tx=0;
    sw.ontouchstart=e=>{tx=e.touches[0].clientX;};
    sw.ontouchend=e=>{
      const dx=e.changedTouches[0].clientX-tx;
      if(Math.abs(dx)>40)swiperMove(dx<0?1:-1);
    };
  }else{sw.style.display='none';}

  const mb=document.getElementById('dmap-box');
  mb.innerHTML='';
  if(dMapInst){dMapInst.remove();dMapInst=null;}
  dMapInst=L.map(mb,{center:[p.lat,p.lng],zoom:13});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(dMapInst);
  L.marker([p.lat,p.lng],{icon:icon(p.kingdom)}).addTo(dMapInst);
  setTimeout(()=>{dMapInst.invalidateSize();dMapInst.setView([p.lat,p.lng],13);},300);

  document.getElementById('d-wiki').innerHTML='読み込み中...';
  fetch(`https://ja.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(p.species)}&format=json&origin=*&prop=text`)
    .then(r=>r.json()).then(data=>{
      if(data.error){document.getElementById('d-wiki').textContent='情報が見つかりませんでした。';return;}
      const doc=new DOMParser().parseFromString(data.parse.text['*'],'text/html');
      doc.querySelectorAll('table.infobox,.mw-references-wrap,.reflist,.thumb,.mw-editsection').forEach(el=>el.remove());
      doc.querySelectorAll('a').forEach(a=>{a.removeAttribute('href');a.style.color='inherit';a.style.textDecoration='none';});
      const allowed=['概要','分布','利用','種の保全状況評価'];
      let html='',kids=Array.from((doc.querySelector('#mw-content-text')||doc.body).children),i=0,lead=[];
      while(i<kids.length&&kids[i].tagName!=='H2'){lead.push(kids[i].outerHTML);i++;}
      if(lead.length){const d2=document.createElement('div');d2.innerHTML=lead.join('');d2.querySelectorAll('img').forEach(e=>e.remove());html+=`<h2>概要</h2>${d2.innerHTML}`;}
      while(i<kids.length){
        if(kids[i].tagName==='H2'){
          const t=kids[i].textContent.replace(/\[.*?\]/g,'').trim();
          if(allowed.includes(t)){
            html+=`<h2>${t}</h2>`;i++;
            while(i<kids.length&&kids[i].tagName!=='H2'){
              const el=kids[i].cloneNode(true);
              if(t!=='種の保全状況評価')el.querySelectorAll('img').forEach(e=>e.remove());
              html+=el.outerHTML;i++;
            }
          }else{i++;while(i<kids.length&&kids[i].tagName!=='H2')i++;}
        }else i++;
      }
      document.getElementById('d-wiki').innerHTML=html||'情報が見つかりませんでした。';
    }).catch(()=>{document.getElementById('d-wiki').textContent='読み込みに失敗しました。';});

  showPage('detail');
}

function buildSwiper(idx){
  swiperIdx=idx;
  const track=document.getElementById('swiper-track');
  track.innerHTML='';
  swiperImgs.forEach(src=>{
    const s=document.createElement('div');s.className='swiper-slide';
    s.innerHTML=`<img src="${src}" onclick="openModal('${src}')">`;
    track.appendChild(s);
  });
  track.style.transform=`translateX(-${swiperIdx*100}%)`;
  const dots=document.getElementById('swiper-dots');
  dots.innerHTML='';
  if(swiperImgs.length>1){
    swiperImgs.forEach((_,i)=>{
      const d=document.createElement('div');d.className='sdot'+(i===idx?' active':'');
      dots.appendChild(d);
    });
  }
  document.getElementById('swiper-prev').style.display=swiperImgs.length>1?'flex':'none';
  document.getElementById('swiper-next').style.display=swiperImgs.length>1?'flex':'none';
}
function swiperMove(dir){
  swiperIdx=(swiperIdx+dir+swiperImgs.length)%swiperImgs.length;
  document.getElementById('swiper-track').style.transform=`translateX(-${swiperIdx*100}%)`;
  document.querySelectorAll('#swiper-dots .sdot').forEach((d,i)=>d.classList.toggle('active',i===swiperIdx));
}

  let dpTargetId='f-dt';

  function range(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}

  function buildCol(colId,innerId,items,fmt,selected){
    const inner=document.getElementById(innerId);
    inner.innerHTML='';
    items.forEach(v=>{
      const d=document.createElement('div');
      d.className='dp-item';
      d.textContent=fmt(v);
      inner.appendChild(d);
    });
    const col=document.getElementById(colId);
    const idx=items.indexOf(selected);
    // scroll after paint
    requestAnimationFrame(()=>{
      col.scrollTop=idx*ITEM_H;
      highlightCol(col,items,idx);
    });
  }

  function highlightCol(col,items,centerIdx){
    col.querySelectorAll('.dp-item').forEach((el,i)=>{
      el.style.color= i===centerIdx ? 'var(--gd)' : '#bbb';
      el.style.fontWeight= i===centerIdx ? '700' : '400';
    });
  }

  function getColValue(colId,items){
    const col=document.getElementById(colId);
    const idx=Math.round(col.scrollTop/ITEM_H);
    return items[Math.max(0,Math.min(idx,items.length-1))];
  }

  function daysInMonth(y,m){return new Date(y,m,0).getDate();}

  function rebuildDays(keepDay){
    const y=getColValue('dp-year',dpYear);
    const m=getColValue('dp-month',dpMonth);
    const maxD=daysInMonth(y,m);
    dpDay=range(1,maxD);
    const day=Math.min(keepDay||1,maxD);
    buildCol('dp-day','dp-day-inner',dpDay,v=>v+'日',day);
  }

  function onScroll(colId,items,siblingCb){
    const col=document.getElementById(colId);
    let t;
    col.addEventListener('scroll',function(){
      clearTimeout(t);
      t=setTimeout(()=>{
        const idx=Math.round(col.scrollTop/ITEM_H);
        col.scrollTop=idx*ITEM_H;
        highlightCol(col,items,idx);
        if(siblingCb)siblingCb();
      },80);
    });
  }

  window.openDatePicker=function(targetId){
    dpTargetId=targetId||'f-dt';
    const existing=document.getElementById(dpTargetId).value;
    let initY=new Date().getFullYear(), initM=new Date().getMonth()+1, initD=new Date().getDate();
    if(existing){
      const m=existing.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if(m){initY=+m[1];initM=+m[2];initD=+m[3];}
    }
    dpYear=range(1900,2100);
    dpMonth=range(1,12);
    dpDay=range(1,daysInMonth(initY,initM));
    buildCol('dp-year','dp-year-inner',dpYear,v=>v+'年',initY);
    buildCol('dp-month','dp-month-inner',dpMonth,v=>v+'月',initM);
    buildCol('dp-day','dp-day-inner',dpDay,v=>v+'日',initD);
    onScroll('dp-year',dpYear,()=>rebuildDays(getColValue('dp-day',dpDay)));
    onScroll('dp-month',dpMonth,()=>rebuildDays(getColValue('dp-day',dpDay)));
    onScroll('dp-day',dpDay,null);
    document.getElementById('date-picker-overlay').classList.add('open');
    document.getElementById('date-picker-sheet').style.display='block';
  };

  window.closeDatePicker=function(apply){
    if(apply){
      const y=getColValue('dp-year',dpYear);
      const m=getColValue('dp-month',dpMonth);
      const d=getColValue('dp-day',dpDay);
      document.getElementById(dpTargetId).value=`${y}年${m}月${d}日`;
    }
    document.getElementById('date-picker-overlay').classList.remove('open');
    document.getElementById('date-picker-sheet').style.display='none';
  };
})();

// ━━ iNaturalist 科・属 自動入力 ━━
// 学名の末尾から和名風の読みを推定するユーティリティ
// iNaturalistの祖先タクソンには preferred_common_name が付いている場合がある。
// 付いていなければ学名をそのまま使う（○○科 / ○○属 のフォーマットで出力）。
function jaNameOf(taxon, suffix){
  // preferred_common_name があれば優先（iNatのja localeで返る和名）
  const name = taxon.preferred_common_name || taxon.name || '';
  // すでに suffix（科/属）で終わっていれば追加しない
  return name.endsWith(suffix) ? name : name + suffix;
}

async function lookupGbif(speciesInputId, familyInputId, genusInputId, msgId){
  const msg = document.getElementById(msgId);
  const speciesName = document.getElementById(speciesInputId).value.trim();
  if(!speciesName){ msg.textContent='先に種名を入力してください'; msg.className='coord-msg err'; return; }
  msg.textContent='iNaturalistを検索中...'; msg.className='coord-msg';
  try{
    // Step1: autocomplete で種を特定
    const res = await fetch(
      `https://api.inaturalist.org/v1/taxa/autocomplete?q=${encodeURIComponent(speciesName)}&per_page=5&locale=ja`
    );
    if(!res.ok) throw new Error('network');
    const data = await res.json();
    const results = data.results || [];
    if(results.length === 0){
      msg.textContent='iNaturalistで種が見つかりませんでした'; msg.className='coord-msg err'; return;
    }
    const taxon = results[0];

    // Step2: /taxa/{id} を locale=ja で取得 → ancestors に preferred_common_name が付く
    const res2 = await fetch(
      `https://api.inaturalist.org/v1/taxa/${taxon.id}?locale=ja`
    );
    if(!res2.ok) throw new Error('network');
    const d2 = await res2.json();
    const full = (d2.results && d2.results[0]) || taxon;
    const ancestors = full.ancestors || [];

    let familyTaxon = null, genusTaxon = null;
    for(const a of ancestors){
      if(a.rank === 'family') familyTaxon = a;
      if(a.rank === 'genus')  genusTaxon  = a;
    }
    if(!familyTaxon && full.rank === 'family') familyTaxon = full;
    if(!genusTaxon  && full.rank === 'genus')  genusTaxon  = full;

    const familyLabel = familyTaxon ? jaNameOf(familyTaxon, '科') : '';
    const genusLabel  = genusTaxon  ? jaNameOf(genusTaxon,  '属') : '';

    if(familyLabel) document.getElementById(familyInputId).value = familyLabel;
    if(genusLabel)  document.getElementById(genusInputId).value  = genusLabel;

    const displayName = full.preferred_common_name || full.name || speciesName;
    const fLabel = familyLabel || '科不明';
    const gLabel = genusLabel  || '属不明';
    msg.textContent = `取得しました: ${fLabel} / ${gLabel}（${displayName}）`;
    msg.className = 'coord-msg';
  }catch(e){
    msg.textContent = 'iNaturalistへの接続に失敗しました'; msg.className='coord-msg err';
  }
}

// ━━ EXCEL EXPORT ━━
const XL_HEADERS = [
  '種名','界','科','属',
  '発見日','都道府県・市町村','絶滅危惧',
  '緯度','経度',
  'メモ','記録日時'
];

function pinsToRows(){
  return pins.map(p=>([
    p.species||'',
    p.kingdom||'',
    p.family||'',
    p.genus||'',
    p.discoveredDate||'',
    p.location||'',
    p.conservation||'',
    p.lat!=null?p.lat:'',
    p.lng!=null?p.lng:'',
    p.details||'',
    p.timestamp||''
  ]));
}

function buildXlPreview(){
  const cnt = document.getElementById('xl-cnt');
  cnt.textContent = pins.length;
  if(!pins.length){toast('記録がありません');return;}

  const rows = pinsToRows();
  const tbl = document.getElementById('xl-table');
  const thStyle = 'background:#1B4332;color:#fff;padding:5px 8px;font-size:.68rem;white-space:nowrap;text-align:left;';
  const tdStyle = 'padding:4px 8px;border-bottom:1px solid #e8e8e8;white-space:nowrap;font-size:.7rem;max-width:160px;overflow:hidden;text-overflow:ellipsis;';

  let html = '<thead><tr>' + XL_HEADERS.map(h=>`<th style="${thStyle}">${h}</th>`).join('') + '</tr></thead><tbody>';
  const preview = rows.slice(0,5);
  preview.forEach(r=>{
    html += '<tr>' + r.map(v=>`<td style="${tdStyle}" title="${String(v).replace(/"/g,'&quot;')}">${v}</td>`).join('') + '</tr>';
  });
  if(rows.length>5){
    html += `<tr><td colspan="${XL_HEADERS.length}" style="padding:6px 8px;color:#888;font-size:.68rem;font-style:italic;">… 他 ${rows.length-5} 件</td></tr>`;
  }
  html += '</tbody>';
  tbl.innerHTML = html;

  document.getElementById('xl-preview').style.display='block';
  document.getElementById('xl-dl-btn').style.display='flex';
}

function exportXlsx(){
  if(!pins.length){toast('記録がありません');return;}

  const rows = pinsToRows();
  const wsData = [XL_HEADERS, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // 列幅設定
  const colWidths = [20,10,14,14,14,22,16,12,12,30,18];
  ws['!cols'] = colWidths.map(w=>({wch:w}));

  // ヘッダー行スタイル（背景・太字）
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let c=range.s.c; c<=range.e.c; c++){
    const addr = XLSX.utils.encode_cell({r:0,c});
    if(!ws[addr]) continue;
    ws[addr].s = {
      font:{bold:true,color:{rgb:'FFFFFF'},name:'Arial'},
      fill:{fgColor:{rgb:'1B4332'}},
      alignment:{horizontal:'center',vertical:'center'},
      border:{
        bottom:{style:'medium',color:{rgb:'52B788'}}
      }
    };
  }
  // データ行：緯度・経度を数値型に
  for(let r=1; r<=rows.length; r++){
    // 緯度 col=7, 経度 col=8
    [7,8].forEach(c=>{
      const addr=XLSX.utils.encode_cell({r,c});
      if(ws[addr]&&ws[addr].v!=='') ws[addr].t='n';
    });
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '生物記録');

  // サマリーシート
  const kingdoms = ['植物界','動物界','菌界'];
  const sumData = [
    ['項目','件数'],
    ['総記録数', pins.length],
    [''],
    ['界別集計',''],
    ...kingdoms.map(k=>[k, pins.filter(p=>p.kingdom===k).length]),
    [''],
    ['絶滅危惧種（指定あり）', pins.filter(p=>p.conservation&&p.conservation!=='指定なし').length],
    [''],
    ['エクスポート日時', new Date().toLocaleString('ja-JP')]
  ];
  const wsSummary = XLSX.utils.aoa_to_sheet(sumData);
  wsSummary['!cols']=[{wch:24},{wch:10}];
  // サマリーヘッダースタイル
  ['A1','B1'].forEach(addr=>{
    if(!wsSummary[addr])return;
    wsSummary[addr].s={font:{bold:true,color:{rgb:'FFFFFF'},name:'Arial'},fill:{fgColor:{rgb:'1B4332'}}};
  });
  XLSX.utils.book_append_sheet(wb, wsSummary, 'サマリー');

  const date = new Date().toISOString().slice(0,10).replace(/-/g,'');
  XLSX.writeFile(wb, `生物記録_${date}.xlsx`);
  toast('Excelをダウンロードしました');
}
